[build]
  # 1. Install PHP deps  2. Install JS deps  3. Vite build  4. Export to static HTML
  command = "composer install --no-dev --optimize-autoloader && npm ci && npm run build && mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache storage/logs && chmod -R 777 storage bootstrap/cache && APP_URL=$URL php export.php"
  publish  = "dist"

[build.environment]
  PHP_VERSION    = "8.3"
  NODE_VERSION   = "20"
  APP_ENV        = "production"
  APP_DEBUG      = "false"
  # APP_KEY must be set as a secret in the Netlify UI — do NOT put it here.
  # Project configuration → Environment variables → Add variable
  #   Key:   APP_KEY
  #   Value: base64:kW0IQ9qoy4UBqcDa5FEh0bVWIWDXgXaW7yldE8lAjCg=

  # Use in-memory drivers — this is a frontend-only static export, no DB needed.
  DB_CONNECTION      = "sqlite"
  DB_DATABASE        = ":memory:"
  CACHE_STORE        = "array"
  SESSION_DRIVER     = "array"
  QUEUE_CONNECTION   = "sync"
  LOG_CHANNEL        = "stderr"
  BROADCAST_CONNECTION = "log"
  FILESYSTEM_DISK    = "local"

# ── Redirect rules ────────────────────────────────────────────────────────────
# All known routes have an index.html in dist/; Netlify serves them automatically.
# The rules below handle the /logout alias and a catch-all 404 fallback.

[[redirects]]
  from   = "/logout"
  to     = "/"
  status = 302

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404
